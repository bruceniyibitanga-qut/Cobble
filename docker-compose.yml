services:
  # Database (PostgreSQL) — schema.sql is applied automatically on first run
  db:
    image: postgres:16-alpine
    container_name: cobble-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qut_crm
      POSTGRES_USER: qut_crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
    ports:
      - "5432:5432"
    volumes:
      - cobble-pgdata:/var/lib/postgresql/data
      - ./Schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qut_crm -d qut_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cobble-network

  # API (ASP.NET Core / C#)
  api:
    build:
      context: ./api/CobbleAPI
      dockerfile: CobbleAPI/Dockerfile
    container_name: cobble-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Port=5432;Database=qut_crm;Username=qut_crm;Password=${DB_PASSWORD:-changeme_local_only}
      - Jwt__Issuer=CobbleAPI
      - Jwt__Audience=CobbleFrontend
      - Jwt__ExpiryInMinutes=60
      - Jwt__Secret=${JWT_SECRET:-b7a87d34f3b19256c183bb07baa192fc2548c810b4e030f68629624f99ba5274}
    networks:
      - cobble-network

  # pgAdmin 4 — visual DB explorer and ER diagram tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cobble-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - cobble-pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cobble-network

volumes:
  cobble-pgdata:
  cobble-pgadmin-data:

networks:
  cobble-network:
    driver: bridge
