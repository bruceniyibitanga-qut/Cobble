services:
  # Database (MySQL 8.4 LTS) — schema.sql is applied automatically on first run
  db:
    image: mysql:8.4
    container_name: qpf-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qut_partnerforge
      MYSQL_USER: qut_partnerforge
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_local_only_root}
    ports:
      - "3306:3306"
    volumes:
      - qpf-dbdata:/var/lib/mysql
      - ./Schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "qut_partnerforge", "-p${DB_PASSWORD:-changeme_local_only}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qpf-network

  # API (ASP.NET Core / C#)
  api:
    build:
      context: ./api/Qut.PartnerForge.Api
      dockerfile: Qut.PartnerForge.Api/Dockerfile
    container_name: qpf-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=db;Port=3306;Database=qut_partnerforge;User=qut_partnerforge;Password=${DB_PASSWORD:-changeme_local_only}
      - Jwt__Issuer=Qut.PartnerForge.Api
      - Jwt__Audience=Qut.PartnerForge.Frontend
      - Jwt__ExpiryInMinutes=60
      # JWT keys are loaded from appsettings.json in dev.
      # In production, override Jwt__PrivateKeyPem and Jwt__PublicKeyPem via environment or Docker secrets.
    networks:
      - qpf-network

  # Adminer — lightweight web UI for browsing the database
  adminer:
    image: adminer:latest
    container_name: qpf-adminer
    restart: unless-stopped
    ports:
      - "5050:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qpf-network

volumes:
  qpf-dbdata:

networks:
  qpf-network:
    driver: bridge