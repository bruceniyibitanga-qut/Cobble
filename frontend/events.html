<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — Cobble CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    nav {
      background: #002C5F;
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav h1 { font-size: 18px; font-weight: 600; }
    nav a { color: white; text-decoration: none; font-size: 14px; opacity: 0.8; }
    nav a:hover { opacity: 1; }
    .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-header h2 { font-size: 22px; font-weight: 600; }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary { background: #002C5F; color: white; }
    .btn-primary:hover { background: #001a3a; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filters select {
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }
    table {
      width: 100%;
      background: white;
      border-radius: 12px;
      border-collapse: collapse;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    thead { background: #002C5F; color: white; }
    th { padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 600; }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }
    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #dbeafe;
      color: #1e40af;
    }
    .action-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      margin-right: 4px;
    }
    .btn-view { background: #eff6ff; color: #1d4ed8; }
    .btn-delete { background: #fef2f2; color: #991b1b; }
    .empty { text-align: center; padding: 48px; color: #6b7280; font-size: 15px; }
    .loading { text-align: center; padding: 48px; color: #6b7280; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; color: #002C5F; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group textarea { height: 80px; resize: vertical; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    .detail-label { color: #6b7280; font-weight: 500; }
    .detail-value { font-weight: 600; }
    .attendees-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }
    .attendees-section h4 { font-size: 15px; margin-bottom: 12px; color: #002C5F; }
    .attendee-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
      border-bottom: 1px solid #f9fafb;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Cobble CRM</h1>
    <div style="display:flex;gap:24px;align-items:center;">
      <a href="dashboard.html">Dashboard</a>
      <a href="organisations.html">Organisations</a>
      <a href="projects.html">Projects</a>
      <a href="events.html">Events</a>
      <a href="login.html" id="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h2>Events</h2>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Event</button>
    </div>

    <div class="filters">
      <select id="type-filter" onchange="loadEvents()">
        <option value="">All Types</option>
        <option value="showcase">Showcase</option>
        <option value="expo">Expo</option>
        <option value="meeting">Meeting</option>
        <option value="scholar_program">Scholar Program</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Date</th>
          <th>Location</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="events-table-body">
        <tr><td colspan="5" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Add Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <h3>Add Event</h3>
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="ev-name" placeholder="Event name" />
      </div>
      <div class="form-group">
        <label>Event Type</label>
        <select id="ev-type">
          <option value="showcase">Showcase</option>
          <option value="expo">Expo</option>
          <option value="meeting">Meeting</option>
          <option value="scholar_program">Scholar Program</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date *</label>
        <input type="date" id="ev-date" lang="en" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="ev-location" placeholder="e.g. QUT Gardens Point" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="ev-desc" placeholder="Event description"></textarea>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="ev-notes" placeholder="Additional notes"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addEvent()">Add</button>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal-overlay" id="view-modal">
    <div class="modal">
      <h3>Event Details</h3>
      <div id="ev-details"></div>

      <div class="attendees-section">
        <h4>Attending Organisations</h4>
        <div id="ev-attendees"></div>
        <div class="form-group" style="margin-top:12px;">
          <label>Add Organisation</label>
          <select id="attend-org">
            <option value="">Select organisation...</option>
          </select>
        </div>
        <button class="btn btn-primary" style="margin-top:8px;width:100%;" onclick="addAttendance()">+ Add Attendance</button>
      </div>

      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8080";
    const token = localStorage.getItem("authToken");
    let currentEventId = null;

    if (!token) window.location.href = "login.html";

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });

    async function loadOrganisations() {
      try {
        const res = await fetch(`${API_BASE}/api/Organisations`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const orgs = await res.json();
        const options = orgs.map(o => `<option value="${o.id}">${o.name}</option>`).join("");
        document.getElementById("attend-org").innerHTML += options;
      } catch (err) {
        console.error("Failed to load organisations");
      }
    }

    async function loadEvents() {
      const type = document.getElementById("type-filter").value;
      let url = `${API_BASE}/api/Events?`;
      if (type) url += `type=${encodeURIComponent(type)}`;

      const tbody = document.getElementById("events-table-body");
      tbody.innerHTML = `<tr><td colspan="5" class="loading">Loading...</td></tr>`;

      try {
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const events = await res.json();

        if (events.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty">No events found.</td></tr>`;
          return;
        }

        tbody.innerHTML = events.map(e => `
          <tr>
            <td><strong>${e.name}</strong></td>
            <td><span class="badge">${e.eventType ?? "—"}</span></td>
            <td>${new Date(e.eventDate).toLocaleDateString()}</td>
            <td>${e.location ?? "—"}</td>
            <td>
              <button class="action-btn btn-view" onclick="viewEvent('${e.id}')">View</button>
              <button class="action-btn btn-delete" onclick="deleteEvent('${e.id}')">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Failed to load. Is the API running?</td></tr>`;
      }
    }

    async function viewEvent(id) {
      currentEventId = id;
      try {
        const res = await fetch(`${API_BASE}/api/Events/${id}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const e = await res.json();

        document.getElementById("ev-details").innerHTML = `
          <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value">${e.name}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Type</span>
            <span class="detail-value">${e.eventType ?? "—"}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Date</span>
            <span class="detail-value">${new Date(e.eventDate).toLocaleDateString()}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Location</span>
            <span class="detail-value">${e.location ?? "—"}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Description</span>
            <span class="detail-value">${e.description ?? "—"}</span>
          </div>
        `;

        const attendees = e.attendances ?? [];
        document.getElementById("ev-attendees").innerHTML = attendees.length === 0
          ? `<p style="color:#6b7280;font-size:14px;">No organisations attending yet.</p>`
          : attendees.map(a => `
              <div class="attendee-row">
                <span>${a.organisation?.name ?? "—"}</span>
              </div>
            `).join("");

        document.getElementById("view-modal").classList.add("active");
      } catch (err) {
        alert("Failed to load event.");
      }
    }

    async function addAttendance() {
      const orgId = document.getElementById("attend-org").value;
      if (!orgId) { alert("Please select an organisation."); return; }

      try {
        const res = await fetch(`${API_BASE}/api/Events/${currentEventId}/attendances`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ organisationId: orgId })
        });
        if (!res.ok) throw new Error();
        viewEvent(currentEventId);
      } catch (err) {
        alert("Failed to add attendance.");
      }
    }

    async function addEvent() {
      const name = document.getElementById("ev-name").value;
      const date = document.getElementById("ev-date").value;
      if (!name) { alert("Name is required."); return; }
      if (!date) { alert("Date is required."); return; }

      const body = {
        name,
        eventType: document.getElementById("ev-type").value,
        eventDate: date,
        location: document.getElementById("ev-location").value,
        description: document.getElementById("ev-desc").value,
        notes: document.getElementById("ev-notes").value,
      };

      try {
        const res = await fetch(`${API_BASE}/api/Events`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        closeAddModal();
        loadEvents();
      } catch (err) {
        alert("Failed to add event.");
      }
    }

    async function deleteEvent(id) {
      if (!confirm("Are you sure you want to delete this event?")) return;
      try {
        await fetch(`${API_BASE}/api/Events/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` }
        });
        loadEvents();
      } catch (err) {
        alert("Failed to delete.");
      }
    }

    function openAddModal() {
      document.getElementById("add-modal").classList.add("active");
    }

    function closeAddModal() {
      document.getElementById("add-modal").classList.remove("active");
      document.getElementById("ev-name").value = "";
      document.getElementById("ev-date").value = "";
      document.getElementById("ev-location").value = "";
      document.getElementById("ev-desc").value = "";
      document.getElementById("ev-notes").value = "";
    }

    function closeViewModal() {
      document.getElementById("view-modal").classList.remove("active");
      currentEventId = null;
    }

    loadOrganisations();
    loadEvents();
  </script>
</body>
</html>
