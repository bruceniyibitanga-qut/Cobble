<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Cobble CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    nav {
      background: #002C5F;
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav h1 { font-size: 18px; font-weight: 600; }
    nav a { color: white; text-decoration: none; font-size: 14px; opacity: 0.8; }
    nav a:hover { opacity: 1; }
    .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-header h2 { font-size: 22px; font-weight: 600; }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary { background: #002C5F; color: white; }
    .btn-primary:hover { background: #001a3a; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    table {
      width: 100%;
      background: white;
      border-radius: 12px;
      border-collapse: collapse;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    thead { background: #002C5F; color: white; }
    th { padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 600; }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }
    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-admin { background: #fef3c7; color: #92400e; }
    .badge-course_organiser { background: #dbeafe; color: #1e40af; }
    .badge-industry_partner { background: #d1fae5; color: #065f46; }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .action-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      margin-right: 4px;
    }
    .btn-view { background: #eff6ff; color: #1d4ed8; }
    .btn-delete { background: #fef2f2; color: #991b1b; }
    .empty { text-align: center; padding: 48px; color: #6b7280; font-size: 15px; }
    .loading { text-align: center; padding: 48px; color: #6b7280; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; color: #002C5F; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .admin-only {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Cobble CRM</h1>
    <div style="display:flex;gap:24px;align-items:center;">
      <a href="dashboard.html">Dashboard</a>
      <a href="organisations.html">Organisations</a>
      <a href="projects.html">Projects</a>
      <a href="events.html">Events</a>
      <a href="users.html">Users</a>
      <a href="login.html" id="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h2>User Management</h2>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add User</button>
    </div>

    <div class="admin-only">
      🔒 This page is only accessible to administrators.
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <tr><td colspan="5" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Add User Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <h3>Add User</h3>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="user-name" placeholder="Full name" />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="user-email" placeholder="email@example.com" />
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="user-password" placeholder="Password" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="user-role">
          <option value="course_organiser">Course Organiser</option>
          <option value="admin">Admin</option>
          <option value="industry_partner">Industry Partner</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addUser()">Add</button>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>Edit User</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="edit-name" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="edit-role">
          <option value="course_organiser">Course Organiser</option>
          <option value="admin">Admin</option>
          <option value="industry_partner">Industry Partner</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit-active">
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8080";
    const token = localStorage.getItem("authToken");
    const userRole = localStorage.getItem("userRole");
    let currentUserId = null;

    if (!token) window.location.href = "login.html";
    if (userRole !== "admin") {
      alert("Access denied. Admins only.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });

    async function loadUsers() {
      const tbody = document.getElementById("users-table-body");
      tbody.innerHTML = `<tr><td colspan="5" class="loading">Loading...</td></tr>`;

      try {
        const res = await fetch(`${API_BASE}/api/Users`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const users = await res.json();

        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty">No users found.</td></tr>`;
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr>
            <td><strong>${u.fullName}</strong></td>
            <td>${u.email}</td>
            <td><span class="badge badge-${u.role?.name}">${u.role?.name ?? "—"}</span></td>
            <td><span class="badge badge-${u.isActive ? 'active' : 'inactive'}">${u.isActive ? 'Active' : 'Inactive'}</span></td>
            <td>
              <button class="action-btn btn-view" onclick="editUser('${u.id}', '${u.fullName}', '${u.role?.name}', ${u.isActive})">Edit</button>
              <button class="action-btn btn-delete" onclick="deleteUser('${u.id}')">Disable</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Failed to load. Admins only.</td></tr>`;
      }
    }

    function editUser(id, name, role, isActive) {
      currentUserId = id;
      document.getElementById("edit-name").value = name;
      document.getElementById("edit-role").value = role;
      document.getElementById("edit-active").value = isActive.toString();
      document.getElementById("edit-modal").classList.add("active");
    }

    async function saveUser() {
      const body = {
        fullName: document.getElementById("edit-name").value,
        role: document.getElementById("edit-role").value,
        isActive: document.getElementById("edit-active").value === "true"
      };

      try {
        const res = await fetch(`${API_BASE}/api/Users/${currentUserId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        closeEditModal();
        loadUsers();
      } catch (err) {
        alert("Failed to save changes.");
      }
    }

    async function addUser() {
      const name = document.getElementById("user-name").value;
      const email = document.getElementById("user-email").value;
      const password = document.getElementById("user-password").value;
      const role = document.getElementById("user-role").value;

      if (!name || !email || !password) {
        alert("Name, email and password are required.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/Auth/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ fullName: name, email, password, role })
        });
        if (!res.ok) throw new Error();
        closeAddModal();
        loadUsers();
      } catch (err) {
        alert("Failed to add user.");
      }
    }

    async function deleteUser(id) {
      if (!confirm("Are you sure you want to disable this user?")) return;
      try {
        await fetch(`${API_BASE}/api/Users/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` }
        });
        loadUsers();
      } catch (err) {
        alert("Failed to disable user.");
      }
    }

    function openAddModal() {
      document.getElementById("add-modal").classList.add("active");
    }

    function closeAddModal() {
      document.getElementById("add-modal").classList.remove("active");
      document.getElementById("user-name").value = "";
      document.getElementById("user-email").value = "";
      document.getElementById("user-password").value = "";
    }

    function closeEditModal() {
      document.getElementById("edit-modal").classList.remove("active");
      currentUserId = null;
    }

    loadUsers();
  </script>
</body>
</html>
