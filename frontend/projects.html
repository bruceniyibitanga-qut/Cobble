<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Cobble CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    nav {
      background: #002C5F;
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav h1 { font-size: 18px; font-weight: 600; }
    nav a { color: white; text-decoration: none; font-size: 14px; opacity: 0.8; }
    nav a:hover { opacity: 1; }
    .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-header h2 { font-size: 22px; font-weight: 600; }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary { background: #002C5F; color: white; }
    .btn-primary:hover { background: #001a3a; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }
    .filters input { flex: 1; min-width: 200px; }
    table {
      width: 100%;
      background: white;
      border-radius: 12px;
      border-collapse: collapse;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    thead { background: #002C5F; color: white; }
    th { padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 600; }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }
    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-proposed { background: #dbeafe; color: #1e40af; }
    .badge-ongoing { background: #d1fae5; color: #065f46; }
    .badge-completed { background: #fef3c7; color: #92400e; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }
    .action-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      margin-right: 4px;
    }
    .btn-view { background: #eff6ff; color: #1d4ed8; }
    .btn-delete { background: #fef2f2; color: #991b1b; }
    .empty { text-align: center; padding: 48px; color: #6b7280; font-size: 15px; }
    .loading { text-align: center; padding: 48px; color: #6b7280; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; color: #002C5F; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group textarea { height: 80px; resize: vertical; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Cobble CRM</h1>
    <div style="display:flex;gap:24px;align-items:center;">
      <a href="dashboard.html">Dashboard</a>
      <a href="organisations.html">Organisations</a>
      <a href="projects.html">Projects</a>
      <a href="applications.html">Applications</a>
      <a href="login.html" id="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h2>Projects</h2>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Project</button>
    </div>

    <div class="filters">
      <input type="text" id="search" placeholder="Search by title..." oninput="loadProjects()" />
      <select id="status-filter" onchange="loadProjects()">
        <option value="">All Statuses</option>
        <option value="proposed">Proposed</option>
        <option value="ongoing">Ongoing</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="semester-filter" onchange="loadProjects()">
        <option value="">All Semesters</option>
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="SS">SS</option>
      </select>
      <select id="year-filter" onchange="loadProjects()">
        <option value="">All Years</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Organisation</th>
          <th>Semester</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="projects-table-body">
        <tr><td colspan="5" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Add Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <h3>Add Project</h3>
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="proj-title" placeholder="Project title" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="proj-desc" placeholder="Project description"></textarea>
      </div>
      <div class="form-group">
        <label>Organisation *</label>
        <select id="proj-org">
          <option value="">Select organisation...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Project Type</label>
        <select id="proj-type">
          <option value="capstone">Capstone</option>
          <option value="undergrad">Undergrad</option>
          <option value="postgrad">Postgrad</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Semester *</label>
          <select id="proj-semester">
            <option value="S1">S1</option>
            <option value="S2">S2</option>
            <option value="SS">SS</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year *</label>
          <input type="number" id="proj-year" value="2026" min="2019" max="2100" />
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="proj-status">
          <option value="proposed">Proposed</option>
          <option value="ongoing">Ongoing</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addProject()">Add</button>
      </div>
    </div>
  </div>

  <!-- View/Edit Modal -->
  <div class="modal-overlay" id="view-modal">
    <div class="modal">
      <h3>Project Details</h3>
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="view-title" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="view-desc"></textarea>
      </div>
      <div class="form-group">
        <label>Project Type</label>
        <select id="view-type">
          <option value="capstone">Capstone</option>
          <option value="undergrad">Undergrad</option>
          <option value="postgrad">Postgrad</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Semester *</label>
          <select id="view-semester">
            <option value="S1">S1</option>
            <option value="S2">S2</option>
            <option value="SS">SS</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year *</label>
          <input type="number" id="view-year" min="2019" max="2100" />
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="view-status">
          <option value="proposed">Proposed</option>
          <option value="ongoing">Ongoing</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="view-notes"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeViewModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProject()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8080";
    const token = localStorage.getItem("authToken");
    let currentProjectId = null;

    if (!token) window.location.href = "login.html";

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });

    // 填充年份下拉框
    const yearSelect = document.getElementById("year-filter");
    for (let y = 2026; y >= 2019; y--) {
      yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
    }

    async function loadOrganisations() {
      try {
        const res = await fetch(`${API_BASE}/api/Organisations`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const orgs = await res.json();
        const options = orgs.map(o => `<option value="${o.id}">${o.name}</option>`).join("");
        document.getElementById("proj-org").innerHTML += options;
      } catch (err) {
        console.error("Failed to load organisations");
      }
    }

    async function loadProjects() {
      const search = document.getElementById("search").value;
      const status = document.getElementById("status-filter").value;
      const semester = document.getElementById("semester-filter").value;
      const year = document.getElementById("year-filter").value;

      let url = `${API_BASE}/api/Projects?`;
      if (search) url += `search=${encodeURIComponent(search)}&`;
      if (status) url += `status=${encodeURIComponent(status)}&`;
      if (semester) url += `semester=${encodeURIComponent(semester)}&`;
      if (year) url += `year=${encodeURIComponent(year)}`;

      const tbody = document.getElementById("projects-table-body");
      tbody.innerHTML = `<tr><td colspan="5" class="loading">Loading...</td></tr>`;

      try {
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const projects = await res.json();

        if (projects.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty">No projects found.</td></tr>`;
          return;
        }

        tbody.innerHTML = projects.map(p => `
          <tr>
            <td><strong>${p.title}</strong></td>
            <td>${p.organisationName ?? p.organisation?.name ?? "—"}</td>
            <td>${p.semester} ${p.year}</td>
            <td><span class="badge badge-${p.status}">${p.status}</span></td>
            <td>
              <button class="action-btn btn-view" onclick="viewProject('${p.id}')">View</button>
              <button class="action-btn btn-delete" onclick="deleteProject('${p.id}')">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Failed to load. Is the API running?</td></tr>`;
      }
    }

    async function viewProject(id) {
      currentProjectId = id;
      try {
        const res = await fetch(`${API_BASE}/api/Projects/${id}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const p = await res.json();

        document.getElementById("view-title").value = p.title ?? "";
        document.getElementById("view-desc").value = p.description ?? "";
        document.getElementById("view-type").value = p.projectType ?? "capstone";
        document.getElementById("view-semester").value = p.semester ?? "S1";
        document.getElementById("view-year").value = p.year ?? 2026;
        document.getElementById("view-status").value = p.status ?? "proposed";
        document.getElementById("view-notes").value = p.notes ?? "";

        document.getElementById("view-modal").classList.add("active");
      } catch (err) {
        alert("Failed to load project.");
      }
    }

    async function saveProject() {
      const body = {
        title: document.getElementById("view-title").value,
        description: document.getElementById("view-desc").value,
        projectType: document.getElementById("view-type").value,
        semester: document.getElementById("view-semester").value,
        year: parseInt(document.getElementById("view-year").value),
        status: document.getElementById("view-status").value,
        notes: document.getElementById("view-notes").value,
      };

      try {
        const res = await fetch(`${API_BASE}/api/Projects/${currentProjectId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        closeViewModal();
        loadProjects();
      } catch (err) {
        alert("Failed to save changes.");
      }
    }

    async function addProject() {
      const title = document.getElementById("proj-title").value;
      const orgId = document.getElementById("proj-org").value;
      if (!title) { alert("Title is required."); return; }
      if (!orgId) { alert("Organisation is required."); return; }

      const body = {
        title,
        description: document.getElementById("proj-desc").value,
        organisationId: orgId,
        projectType: document.getElementById("proj-type").value,
        semester: document.getElementById("proj-semester").value,
        year: parseInt(document.getElementById("proj-year").value),
        status: document.getElementById("proj-status").value,
      };

      try {
        const res = await fetch(`${API_BASE}/api/Projects`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        closeAddModal();
        loadProjects();
      } catch (err) {
        alert("Failed to add project.");
      }
    }

    async function deleteProject(id) {
      if (!confirm("Are you sure you want to delete this project?")) return;
      try {
        await fetch(`${API_BASE}/api/Projects/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` }
        });
        loadProjects();
      } catch (err) {
        alert("Failed to delete.");
      }
    }

    function openAddModal() {
      document.getElementById("add-modal").classList.add("active");
    }

    function closeAddModal() {
      document.getElementById("add-modal").classList.remove("active");
      document.getElementById("proj-title").value = "";
      document.getElementById("proj-desc").value = "";
      document.getElementById("proj-org").value = "";
    }

    function closeViewModal() {
      document.getElementById("view-modal").classList.remove("active");
      currentProjectId = null;
    }

    loadOrganisations();
    loadProjects();
  </script>
</body>
</html>
