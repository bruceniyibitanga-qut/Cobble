services:
  mysql:
    image: mysql:8.4
    container_name: qpf-schema-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qut_partnerforge
      MYSQL_USER: qut_partnerforge
      MYSQL_PASSWORD: changeme_local_only
      MYSQL_ROOT_PASSWORD: changeme_local_only_root
    ports:
      - "3307:3306"  # 3307 to avoid conflict with the main docker-compose.yml
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-runs on first DB init only. Delete the volume to re-run.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "qut_partnerforge", "-pchangeme_local_only"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: qpf-schema-adminer
    restart: unless-stopped
    ports:
      - "5051:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: